<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth State Debugger</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
    }

    pre {
      background: #f4f4f4;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>OAuth State Debugger</h1>
  <p>Decoded <code>state</code> parameter:</p>

  <pre id="output">Waiting...</pre>

  <script>
    function getState() {
      const params = new URLSearchParams(window.location.search);
      const state = params.get("state");

      if (!state) {
        return "No state parameter supplied.";
      }

      const decodedURI = decodeURIComponent(state);

      // Attempt Base64 decoding.
      try {
        const decoded = atob(decodedURI);

        if (decoded) {
          return decoded;
        }
      } catch (e) {
        // Not Base64; return the original value.
      }

      return decodedURI;
    }

    document.getElementById("output").textContent = getState();
  </script>
</body>
</html>
